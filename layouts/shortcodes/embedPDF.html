{{- /*
Embeds a PDF viewer using PDF.js.

@param {string} src The relative path to the PDF file (relative to the page).

@examples

  {{< embedPDF src="document.pdf" >}}

*/}}
{{ $src := .Get "src" }}
<pdfjs-viewer-element 
src="{{.Page.Permalink}}{{ $src }}" 
viewer-path="/pdfjs-5.4.394-dist"
iframe-title="pdfjs-viewer"
style="height: 500px; padding-top: 20px; padding-bottom: 20px;"></pdfjs-viewer-element>
