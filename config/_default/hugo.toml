# Default Settings
baseURL = 'https://darrenzheng24.github.io/'
languageCode = 'en-us'
title = 'Darren Zheng | Mathematics Grad @ University of Pennsylvania' # Search index title for home page
RelativeURLs = true
CanonifyURLs = true
enableEmoji = true
enableGitInfo = true
enableRobotsTXT = true

# Disable taxonomy pages for categories and tags
disableKinds = ["taxonomy"]

ignoreLogs = ['warning-goldmark-raw-html']

# Ignore files under "hugo-ignore" subdirectories of content page bundles
ignoreFiles = ["hugo-ignore"]

[permalinks]
  post = "/:year/:month/:day/:slug/"

[caches]
  [caches.images]
    dir = ':cacheDir/images'

# Taxonomies (required for Poison theme)
[taxonomies]
  series = 'series'
  tags = 'tags'

# Build Settings
cleanDestinationDir = true

# Number of posts on the homepage before generating next page
[pagination]
  pagerSize = 10
